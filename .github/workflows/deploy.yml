name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps > install-log.txt 2>&1 || true

      - name: Build
        run: |
          npm run build > build-log.txt 2>&1 || true
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add build-log.txt install-log.txt
          git commit -m "chore: add build logs" || true
          git push origin HEAD:main || true
          if grep -q "error" build-log.txt; then exit 1; fi
          if grep -q "ERR!" install-log.txt; then exit 1; fi

      - name: Build CraftBill Angular SaaS
        run: |
          npm install --prefix apps/craftbill --no-audit --no-fund
          npm run build --prefix apps/craftbill
          # Preserve a reproducible npm lockfile for the Angular app.
          git add apps/craftbill/package-lock.json
          git commit -m "chore: lock CraftBill npm dependencies" || true
          git push origin HEAD:main || true
          mkdir -p dist/craftbill
          cp -a apps/craftbill/dist/craftbill/browser/. dist/craftbill/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
