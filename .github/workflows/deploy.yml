name: Deploy to GitHub Pages

# Only merges to main (or an intentional manual run) publish to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only repository access: the build must never push commits or write logs to main.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate website
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the exact publishing commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Validate Butterflies Educare source
        run: |
          node scripts/validate-butterflies.mjs public/butterflies-educare
          node --check public/butterflies-educare/site.js
          node --check public/butterflies-educare/atmosphere.js
          node --check public/butterflies-educare/network.js
          node --check public/butterflies-educare/creative-garden.js
          node --check public/butterflies-educare/experience.js
          node --check public/butterflies-educare/studio.js
          node --check public/butterflies-educare/school-information.js
          node --check public/butterflies-educare/calendar.js

      - name: Install portfolio dependencies from lockfile
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build portfolio
        run: npm run build

      - name: Install CraftBill dependencies from lockfile
        run: npm ci --prefix apps/craftbill --no-audit --no-fund

      - name: Build CraftBill Angular SaaS
        run: |
          npm run build --prefix apps/craftbill
          mkdir -p dist/craftbill
          cp -a apps/craftbill/dist/craftbill/browser/. dist/craftbill/

      - name: Validate the actual Pages artifact
        run: |
          node scripts/validate-butterflies.mjs dist/butterflies-educare
          node --check dist/butterflies-educare/site.js
          node --check dist/butterflies-educare/atmosphere.js
          node --check dist/butterflies-educare/network.js
          node --check dist/butterflies-educare/creative-garden.js
          node --check dist/butterflies-educare/experience.js
          node --check dist/butterflies-educare/studio.js
          node --check dist/butterflies-educare/school-information.js
          node --check dist/butterflies-educare/calendar.js
          test -s dist/index.html || { echo "::error::Portfolio homepage missing"; exit 1; }
          test -s dist/craftbill/index.html || { echo "::error::CraftBill homepage missing"; exit 1; }

      - name: Stamp exact publishing revision for live verification
        run: |
          printf '%s\n' "$GITHUB_SHA" > dist/butterflies-educare/deploy-version.txt
          printf '%s\n' "$GITHUB_SHA" > dist/deploy-version.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: https://iederees-create.github.io/3D-Portfolio/
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify actual live release
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm live revision, school HTML, script and favicon
        env:
          SCHOOL_URL: https://iederees-create.github.io/3D-Portfolio/butterflies-educare
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            version="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$SCHOOL_URL/deploy-version.txt?rev=$GITHUB_SHA&try=$attempt" 2>/dev/null || true)"
            if [[ "$version" == "$GITHUB_SHA" ]]; then
              html="$(curl -fsSL --max-time 20 "$SCHOOL_URL/?rev=$GITHUB_SHA&try=$attempt" 2>/dev/null || true)"
              script="$(curl -fsSL --max-time 20 "$SCHOOL_URL/site.js?rev=$GITHUB_SHA&try=$attempt" 2>/dev/null || true)"
              creative="$(curl -fsSL --max-time 20 "$SCHOOL_URL/creative-garden.js?rev=$GITHUB_SHA&try=$attempt" 2>/dev/null || true)"
              creative_css="$(curl -fsSL --max-time 20 "$SCHOOL_URL/creative-garden.css?rev=$GITHUB_SHA&try=$attempt" 2>/dev/null || true)"
              experience="$(curl -fsSL --max-time 20 "$SCHOOL_URL/experience.js?rev=$GITHUB_SHA&try=$attempt" 2>/dev/null || true)"
              experience_css="$(curl -fsSL --max-time 20 "$SCHOOL_URL/experience.css?rev=$GITHUB_SHA&try=$attempt" 2>/dev/null || true)"
              parent="$(curl -fsSL --max-time 20 "$SCHOOL_URL/parent.html?rev=$GITHUB_SHA&try=$attempt" 2>/dev/null || true)"
              studio="$(curl -fsSL --max-time 20 "$SCHOOL_URL/studio.js?rev=$GITHUB_SHA&try=$attempt" 2>/dev/null || true)"
              studio_css="$(curl -fsSL --max-time 20 "$SCHOOL_URL/studio.css?rev=$GITHUB_SHA&try=$attempt" 2>/dev/null || true)"
              school_info="$(curl -fsSL --max-time 20 "$SCHOOL_URL/school-information.js?rev=$GITHUB_SHA&try=$attempt" 2>/dev/null || true)"
              privacy="$(curl -fsSL --max-time 20 "$SCHOOL_URL/privacy.html?rev=$GITHUB_SHA&try=$attempt" 2>/dev/null || true)"
              sitemap="$(curl -fsSL --max-time 20 "$SCHOOL_URL/sitemap.xml?rev=$GITHUB_SHA&try=$attempt" 2>/dev/null || true)"
              calendar="$(curl -fsSL --max-time 20 "$SCHOOL_URL/calendar.html?rev=$GITHUB_SHA&try=$attempt" 2>/dev/null || true)"
              calendar_js="$(curl -fsSL --max-time 20 "$SCHOOL_URL/calendar.js?rev=$GITHUB_SHA&try=$attempt" 2>/dev/null || true)"
              calendar_css="$(curl -fsSL --max-time 20 "$SCHOOL_URL/calendar.css?rev=$GITHUB_SHA&try=$attempt" 2>/dev/null || true)"
              favicon="$(curl -fsSL --max-time 20 "$SCHOOL_URL/favicon.svg?rev=$GITHUB_SHA&try=$attempt" 2>/dev/null || true)"
              if [[ "$html" == *"<title>Butterflies Educare"* ]] &&
                 [[ "$html" == *"</html>"* ]] &&
                 [[ "$html" == *"site.js"* ]] &&
                 [[ "$script" == *"be_public_content"* ]] &&
                 [[ "$html" == *"creative-garden.js"* ]] &&
                 [[ "$creative" == *"creative-vision-20261107"* ]] &&
                 [[ "$creative_css" == *"creative-giving-garden"* ]] &&
                 [[ "$html" == *"experience.js"* ]] &&
                 [[ "$experience" == *"getApprovedFeed"* ]] &&
                 [[ "$experience_css" == *"bex-journeys"* ]] &&
                 [[ "$parent" == *"experience.js"* ]] &&
                 [[ "$html" == *"studio.js"* ]] &&
                 [[ "$parent" == *"studio.js"* ]] &&
                 [[ "$studio" == *"studioPanel"* ]] &&
                 [[ "$studio_css" == *"studio-showcase"* ]] &&
                 [[ "$html" == *'content="index,follow'* ]] &&
                 [[ "$html" == *"school-information.js"* ]] &&
                 [[ "$parent" == *"be-school-information-form"* ]] &&
                 [[ "$school_info" == *"be_school_information"* ]] &&
                 [[ "$privacy" == *"interim technical information"* ]] &&
                 [[ "$sitemap" == *"butterflies-educare/"* ]] &&
                 [[ "$sitemap" == *"calendar.html"* ]] &&
                 [[ "$html" == *"be-calendar-promo"* ]] &&
                 [[ "$parent" == *"calendar.html"* ]] &&
                 [[ "$calendar" == *"cal-request-form"* ]] &&
                 [[ "$calendar" == *"cal-staff"* ]] &&
                 [[ "$calendar_js" == *"be_request_class_slot"* ]] &&
                 [[ "$calendar_css" == *"cal-calendar-layout"* ]] &&
                 [[ "$favicon" == *"<svg"* ]]; then
                echo "Confirmed published revision: $GITHUB_SHA"
                echo "Live site: $SCHOOL_URL/"
                exit 0
              fi
            fi
            echo "Attempt $attempt: Pages has not yet served the matching release and assets."
            sleep 10
          done
          echo "::error::GitHub Pages did not serve revision $GITHUB_SHA with valid school assets."
          exit 1
