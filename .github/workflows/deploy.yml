name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps > install-log.txt 2>&1 || true

      - name: Build
        run: |
          npm run build > build-log.txt 2>&1 || true
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add build-log.txt install-log.txt
          git commit -m "chore: add build logs" || true
          git push origin HEAD:main || true
          if grep -q "error" build-log.txt; then exit 1; fi
          if grep -q "ERR!" install-log.txt; then exit 1; fi

      - name: Build CraftBill Angular SaaS
        run: |
          npm install --prefix apps/craftbill --no-audit --no-fund
          npm run build --prefix apps/craftbill
          # Preserve a reproducible npm lockfile for the Angular app.
          git add apps/craftbill/package-lock.json
          git commit -m "chore: lock CraftBill npm dependencies" || true
          git push origin HEAD:main || true
          mkdir -p dist/craftbill
          cp -a apps/craftbill/dist/craftbill/browser/. dist/craftbill/

      # Prevent publishing a placeholder instead of the school's full preview.
      - name: Validate Butterflies Educare preview
        run: |
          set -euo pipefail
          PAGE="dist/butterflies-educare/index.html"
          test -s "$PAGE" || { echo "::error::Butterflies page is missing"; exit 1; }
          grep -qi '<!doctype html' "$PAGE" || { echo "::error::Butterflies page is not an HTML document"; exit 1; }
          grep -q '<title>Butterflies Educare' "$PAGE" || { echo "::error::Butterflies page has lost its title"; exit 1; }
          grep -qi '</html>' "$PAGE" || { echo "::error::Butterflies page is incomplete"; exit 1; }
          if [ "$(wc -c < "$PAGE")" -lt 4096 ]; then
            echo "::error::Butterflies page is unexpectedly small; refusing to deploy"
            exit 1
          fi
          if grep -Eq 'PLACEHOLDER_(AGAIN|WILL_FAIL)' "$PAGE"; then
            echo "::error::Butterflies placeholder detected; refusing to deploy"
            exit 1
          fi
          test -s dist/butterflies-educare/site.js || { echo "::error::Butterflies script missing"; exit 1; }
          test -s dist/butterflies-educare/favicon.svg || { echo "::error::Butterflies favicon missing"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
