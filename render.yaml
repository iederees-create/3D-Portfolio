# Production hosting blueprint (commercial SaaS must NOT run on GitHub Pages).
# Configure a dedicated CraftBill Supabase project and keep NOWPayments secrets
# exclusively in Supabase Edge Functions.
services:
  - type: web
    name: craftbill-app
    runtime: static
    buildCommand: cd apps/craftbill && npm ci --no-audit --no-fund && npm run build:render
    staticPublishPath: apps/craftbill/dist/craftbill/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
